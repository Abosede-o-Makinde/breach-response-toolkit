[project]
name = "breach-response-toolkit"
version = "1.0.0"
description = "Python toolkit for managing data breach incidents under UK GDPR Articles 33 and 34"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["gdpr", "data-breach", "incident-response", "compliance", "data-protection"]
readme = "README.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src"]
omit = ["tests/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]

[tool.black]
line-length = 100
target-version = ["py311"]
